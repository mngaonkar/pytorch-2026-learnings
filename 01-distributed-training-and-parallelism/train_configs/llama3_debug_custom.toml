[job]
dump_folder = "./outputs"
description = "Llama 3 debug model test on ROCm"

[model]
name = "llama3"
flavor = "debugmodel"
hf_assets_path = "./assets/tokenizer"

[training]
dataset = "c4_validation"
local_batch_size = 2
seq_len = 1024
steps = 10
max_norm = 1.0

[optimizer]
name = "AdamW"
lr = 8e-4

[lr_scheduler]
warmup_steps = 2

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1

