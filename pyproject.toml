[project]
name = "pytorch-2026-learnings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "rocm[device-gfx1201,libraries]==10.1.0",
    "torch[device-gfx1201]==2.14.0+rocm10.1.0",
    "torchaudio==2.11.0.3+rocm10.1.0",
]

[project.optional-dependencies]
# TorchTitan v0.3.0 targets stable torch 2.14; main/v0.4.0 needs a nightly torch
titan = ["torchtitan==0.3.0"]

[[tool.uv.index]]
url = "https://stable.repo.amd.com/rocm/whl-next/"

[tool.uv]
# keep these when TorchTitan is installed next to the ROCm torch pins
override-dependencies = ["datasets>=5.1.0", "spmd-types==0.2.3"]
